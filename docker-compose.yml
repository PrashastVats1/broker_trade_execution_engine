services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kalpi
      POSTGRES_USER: kalpi
      POSTGRES_PASSWORD: kalpi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalpi -d kalpi"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+asyncpg://kalpi:kalpi@db:5432/kalpi
      AUTO_CREATE_SCHEMA: "false"
      ALLOW_LIVE_TRADING: "false"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
